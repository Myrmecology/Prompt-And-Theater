<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Prompt &amp; Theater</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blood:       #8b0000;
            --blood-bright:#c0392b;
            --ash:         #1a1a1a;
            --stone:       #2c2c2c;
            --bone:        #9e9e8a;
            --ember:       #b5451b;
            --fog:         rgba(20, 5, 5, 0.85);
            --gold-dim:    #7a6a3a;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Cinzel', serif;
            cursor: crosshair;
        }

        /* ── CANVAS BACKGROUND ── */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ── GRAIN OVERLAY ── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 128px 128px;
            opacity: 0.4;
            mix-blend-mode: overlay;
        }

        /* ── VIGNETTE ── */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 30%,
                rgba(0,0,0,0.6) 70%,
                rgba(0,0,0,0.95) 100%
            );
        }

        /* ── MAIN STAGE ── */
        .stage {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        /* ── DECORATIVE RULE ── */
        .rule {
            width: 0;
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                var(--gold-dim),
                var(--blood-bright),
                var(--gold-dim),
                transparent
            );
            margin: 18px auto;
            animation: rule-expand 2s ease forwards;
            animation-delay: 1.2s;
        }
        @keyframes rule-expand {
            to { width: min(600px, 80vw); }
        }

        /* ── TITLE BLOCK ── */
        .title-block {
            text-align: center;
            opacity: 0;
            animation: fade-rise 1.4s ease forwards;
            animation-delay: 0.3s;
        }
        @keyframes fade-rise {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title-top {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            font-size: clamp(2rem, 6vw, 5rem);
            letter-spacing: 0.25em;
            color: var(--bone);
            text-shadow:
                0 0 30px rgba(139,0,0,0.4),
                2px 2px 0 #000,
                -1px -1px 0 #111;
            filter: drop-shadow(0 4px 18px rgba(0,0,0,0.9));
            line-height: 1.1;
        }

        .title-amp {
            color: var(--gold-dim);
            font-size: 0.7em;
        }

        /* ── DRIP TITLE ── */
        .title-bottom-wrap {
            position: relative;
            display: inline-block;
            margin-top: 4px;
        }

        .title-bottom {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            font-size: clamp(3rem, 11vw, 9.5rem);
            letter-spacing: 0.08em;
            color: var(--blood);
            text-shadow:
                0 0 60px rgba(139,0,0,0.7),
                0 0 120px rgba(139,0,0,0.3),
                3px 3px 0 #1a0000,
                -2px -2px 0 #300;
            filter: drop-shadow(0 6px 24px rgba(139,0,0,0.6));
            line-height: 1;
            position: relative;
            z-index: 2;
        }

        /* ── SVG DRIPS ── */
        .drips-svg {
            position: absolute;
            top: 85%;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: drips-appear 1s ease forwards;
            animation-delay: 1.8s;
        }
        @keyframes drips-appear {
            to { opacity: 1; }
        }

        /* ── SUBTITLE ── */
        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.55rem, 1.4vw, 0.9rem);
            letter-spacing: 0.5em;
            color: var(--bone);
            opacity: 0;
            text-transform: uppercase;
            margin-top: 8px;
            text-shadow: 0 0 20px rgba(139,0,0,0.5);
            animation: fade-in-slow 2s ease forwards;
            animation-delay: 2s;
        }
        @keyframes fade-in-slow {
            to { opacity: 0.55; }
        }

        /* ── THEATER BUTTON ── */
        .btn-theater-wrap {
            margin-top: 52px;
            opacity: 0;
            animation: fade-rise 1s ease forwards;
            animation-delay: 2.4s;
        }

        .btn-theater {
            position: relative;
            display: inline-block;
            padding: 18px 64px;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Outer border frame */
        .btn-theater::before,
        .btn-theater::after {
            content: '';
            position: absolute;
            transition: all 0.4s ease;
        }
        .btn-theater::before {
            inset: 0;
            border: 1px solid var(--blood);
            box-shadow:
                inset 0 0 20px rgba(139,0,0,0.2),
                0 0 20px rgba(139,0,0,0.15);
        }
        .btn-theater::after {
            inset: 4px;
            border: 1px solid rgba(139,0,0,0.3);
        }

        .btn-theater:hover::before {
            box-shadow:
                inset 0 0 40px rgba(192,57,43,0.4),
                0 0 50px rgba(192,57,43,0.4),
                0 0 100px rgba(139,0,0,0.2);
            border-color: var(--blood-bright);
        }
        .btn-theater:hover::after {
            border-color: rgba(192,57,43,0.5);
        }

        .btn-theater-text {
            position: relative;
            z-index: 2;
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            letter-spacing: 0.4em;
            color: var(--bone);
            text-shadow:
                0 0 20px rgba(192,57,43,0.6),
                0 0 40px rgba(139,0,0,0.3);
            transition: all 0.4s ease;
            display: block;
        }

        .btn-theater:hover .btn-theater-text {
            color: #fff;
            text-shadow:
                0 0 20px rgba(255,255,255,0.4),
                0 0 40px rgba(192,57,43,0.8),
                0 0 80px rgba(139,0,0,0.5);
            letter-spacing: 0.5em;
        }

        /* Corner ornaments */
        .btn-corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: var(--blood-bright);
            border-style: solid;
            transition: all 0.4s ease;
        }
        .btn-corner.tl { top: -1px; left: -1px;  border-width: 2px 0 0 2px; }
        .btn-corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .btn-corner.bl { bottom: -1px; left: -1px;  border-width: 0 0 2px 2px; }
        .btn-corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        .btn-theater:hover .btn-corner {
            width: 14px; height: 14px;
            border-color: #fff;
        }

        /* ── BOTTOM INSCRIPTION ── */
        .inscription {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: var(--bone);
            opacity: 0;
            white-space: nowrap;
            animation: fade-in-slow 2s ease forwards;
            animation-delay: 3s;
        }

        /* ── SIDE RUNES ── */
        .rune {
            position: fixed;
            z-index: 10;
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            color: var(--blood);
            opacity: 0;
            writing-mode: vertical-rl;
            animation: fade-in-slow 2s ease forwards;
            animation-delay: 3.5s;
        }
        .rune.left  { left: 28px; top: 50%; transform: translateY(-50%); }
        .rune.right { right: 28px; top: 50%; transform: translateY(-50%) rotate(180deg); }

    </style>
</head>
<body>

    <!-- Animated background canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Vignette overlay -->
    <div class="vignette"></div>

    <!-- Side rune text -->
    <span class="rune left">PROMPT · THEATER · MMXXVI</span>
    <span class="rune right">PROMPT · THEATER · MMXXVI</span>

    <!-- Main stage -->
    <main class="stage">

        <div class="title-block">
            <div class="title-top">
                Prompt <span class="title-amp">&amp;</span>
            </div>

            <div class="title-bottom-wrap">
                <div class="title-bottom">Theater</div>

                <!-- SVG Blood Drips -->
                <svg class="drips-svg" viewBox="0 0 900 120"
                     preserveAspectRatio="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="dripGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%"   stop-color="#8b0000" stop-opacity="1"/>
                            <stop offset="100%" stop-color="#3a0000" stop-opacity="0.6"/>
                        </linearGradient>
                    </defs>
                    <!-- Each drip: path + circle droplet -->
                    <g fill="url(#dripGrad)">
                        <!-- Drip 1 -->
                        <rect x="95" y="0" width="5" height="0" rx="2">
                            <animate attributeName="height" from="0" to="55"
                                     dur="1.2s" begin="1.9s" fill="freeze"/>
                        </rect>
                        <circle cx="97" cy="0" r="0">
                            <animate attributeName="cy" from="55" to="60"
                                     dur="0.4s" begin="3.1s" fill="freeze"/>
                            <animate attributeName="r" from="0" to="7"
                                     dur="0.4s" begin="3.1s" fill="freeze"/>
                        </circle>
                        <!-- Drip 2 -->
                        <rect x="210" y="0" width="4" height="0" rx="2">
                            <animate attributeName="height" from="0" to="35"
                                     dur="0.9s" begin="2.2s" fill="freeze"/>
                        </rect>
                        <circle cx="212" cy="0" r="0">
                            <animate attributeName="cy" from="35" to="40"
                                     dur="0.4s" begin="3.1s" fill="freeze"/>
                            <animate attributeName="r" from="0" to="5"
                                     dur="0.4s" begin="3.1s" fill="freeze"/>
                        </circle>
                        <!-- Drip 3 -->
                        <rect x="370" y="0" width="6" height="0" rx="2">
                            <animate attributeName="height" from="0" to="70"
                                     dur="1.5s" begin="1.85s" fill="freeze"/>
                        </rect>
                        <circle cx="373" cy="0" r="0">
                            <animate attributeName="cy" from="70" to="77"
                                     dur="0.5s" begin="3.35s" fill="freeze"/>
                            <animate attributeName="r" from="0" to="9"
                                     dur="0.5s" begin="3.35s" fill="freeze"/>
                        </circle>
                        <!-- Drip 4 -->
                        <rect x="500" y="0" width="4" height="0" rx="2">
                            <animate attributeName="height" from="0" to="42"
                                     dur="1s" begin="2.4s" fill="freeze"/>
                        </rect>
                        <circle cx="502" cy="0" r="0">
                            <animate attributeName="cy" from="42" to="48"
                                     dur="0.4s" begin="3.4s" fill="freeze"/>
                            <animate attributeName="r" from="0" to="6"
                                     dur="0.4s" begin="3.4s" fill="freeze"/>
                        </circle>
                        <!-- Drip 5 -->
                        <rect x="660" y="0" width="5" height="0" rx="2">
                            <animate attributeName="height" from="0" to="60"
                                     dur="1.3s" begin="2.0s" fill="freeze"/>
                        </rect>
                        <circle cx="662" cy="0" r="0">
                            <animate attributeName="cy" from="60" to="67"
                                     dur="0.45s" begin="3.3s" fill="freeze"/>
                            <animate attributeName="r" from="0" to="8"
                                     dur="0.45s" begin="3.3s" fill="freeze"/>
                        </circle>
                        <!-- Drip 6 -->
                        <rect x="790" y="0" width="3" height="0" rx="2">
                            <animate attributeName="height" from="0" to="28"
                                     dur="0.8s" begin="2.6s" fill="freeze"/>
                        </rect>
                        <circle cx="791" cy="0" r="0">
                            <animate attributeName="cy" from="28" to="33"
                                     dur="0.35s" begin="3.4s" fill="freeze"/>
                            <animate attributeName="r" from="0" to="4"
                                     dur="0.35s" begin="3.4s" fill="freeze"/>
                        </circle>
                    </g>
                </svg>
            </div>

            <div class="rule"></div>
            <div class="subtitle">Create &nbsp;·&nbsp; Watch &nbsp;·&nbsp; Save &nbsp;·&nbsp; Destroy</div>
        </div>

        <!-- THEATER Button -->
        <div class="btn-theater-wrap">
            <a href="/api/tickets/" class="btn-theater" id="theaterBtn">
                <span class="btn-corner tl"></span>
                <span class="btn-corner tr"></span>
                <span class="btn-corner bl"></span>
                <span class="btn-corner br"></span>
                <span class="btn-theater-text">THEATER</span>
            </a>
        </div>

    </main>

    <!-- Bottom inscription -->
    <div class="inscription">A Theater Of Your Own Making</div>

    <script>
    // ============================================================
    // BACKGROUND — Fog, embers, silhouettes
    // ============================================================
    const canvas = document.getElementById('bg-canvas');
    const ctx    = canvas.getContext('2d');

    let W, H;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ── FOG LAYERS ──
    const fogLayers = Array.from({length: 6}, (_, i) => ({
        y:     H * (0.55 + i * 0.07),
        speed: 0.12 + i * 0.04,
        alpha: 0.06 + i * 0.05,
        scale: 1.2 + i * 0.3,
        offset: Math.random() * W,
    }));

    // ── EMBERS ──
    const EMBER_COUNT = 55;
    const embers = Array.from({length: EMBER_COUNT}, () => ({
        x:     Math.random() * 1200 - 100,
        y:     Math.random() * H,
        r:     Math.random() * 1.8 + 0.4,
        vx:    (Math.random() - 0.5) * 0.3,
        vy:    -(Math.random() * 0.5 + 0.2),
        alpha: Math.random(),
        flicker: Math.random() * Math.PI * 2,
        flickerSpeed: 0.02 + Math.random() * 0.04,
    }));

    // ── STICK FIGURE SILHOUETTES ──
    function drawFigure(x, y, scale, alpha, flip) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = '#1a0000';
        ctx.lineWidth   = scale * 1.5;
        ctx.lineCap     = 'round';
        if (flip) { ctx.scale(-1, 1); x = -x; }

        const s = scale;
        // head
        ctx.beginPath();
        ctx.arc(x, y - s * 18, s * 5, 0, Math.PI * 2);
        ctx.stroke();
        // body
        ctx.beginPath();
        ctx.moveTo(x, y - s * 13);
        ctx.lineTo(x, y);
        ctx.stroke();
        // arms - slow sway
        const armSway = Math.sin(Date.now() * 0.0005 + x) * s * 3;
        ctx.beginPath();
        ctx.moveTo(x - s * 7, y - s * 9 + armSway);
        ctx.lineTo(x + s * 7, y - s * 9 - armSway);
        ctx.stroke();
        // legs
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - s * 5, y + s * 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + s * 5, y + s * 12);
        ctx.stroke();

        ctx.restore();
    }

    // ── ANIMATION LOOP ──
    let frame = 0;

    function draw() {
        ctx.clearRect(0, 0, W, H);

        // Deep background
        const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.8);
        bgGrad.addColorStop(0, '#0d0203');
        bgGrad.addColorStop(1, '#000000');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Red ground glow
        const groundGrad = ctx.createRadialGradient(W/2, H, 0, W/2, H, W * 0.7);
        groundGrad.addColorStop(0,   'rgba(100,0,0,0.35)');
        groundGrad.addColorStop(0.5, 'rgba(60,0,0,0.15)');
        groundGrad.addColorStop(1,   'transparent');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, 0, W, H);

        // Fog layers
        fogLayers.forEach(layer => {
            layer.offset += layer.speed;
            if (layer.offset > W * layer.scale) layer.offset -= W * layer.scale;

            const fg = ctx.createLinearGradient(0, layer.y - 80, 0, layer.y + 60);
            fg.addColorStop(0, 'transparent');
            fg.addColorStop(0.4, `rgba(18,3,3,${layer.alpha})`);
            fg.addColorStop(1,   `rgba(10,0,0,${layer.alpha * 1.5})`);

            ctx.save();
            ctx.translate(-layer.offset, 0);
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.moveTo(0, layer.y);
            for (let x = 0; x <= W * layer.scale * 2; x += 40) {
                const ny = layer.y + Math.sin((x + frame) * 0.008) * 25
                         + Math.cos((x - frame * 0.5) * 0.012) * 15;
                ctx.lineTo(x, ny);
            }
            ctx.lineTo(W * layer.scale * 2, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        });

        // Stick figure silhouettes
        const figY = H * 0.82;
        drawFigure(W * 0.18, figY, 2.2, 0.18 + Math.sin(frame * 0.01) * 0.04, false);
        drawFigure(W * 0.82, figY, 2.2, 0.18 + Math.cos(frame * 0.01) * 0.04, true);

        // Embers
        embers.forEach(e => {
            e.x  += e.vx;
            e.y  += e.vy;
            e.flicker += e.flickerSpeed;
            const flick = 0.4 + Math.sin(e.flicker) * 0.4;

            if (e.y < -10) {
                e.y = H + 10;
                e.x = Math.random() * W;
            }

            const eg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 2.5);
            eg.addColorStop(0,   `rgba(255,80,20,${flick * 0.9})`);
            eg.addColorStop(0.5, `rgba(180,30,10,${flick * 0.5})`);
            eg.addColorStop(1,   'transparent');
            ctx.fillStyle = eg;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.r * 2.5, 0, Math.PI * 2);
            ctx.fill();
        });

        frame++;
        requestAnimationFrame(draw);
    }

    draw();

    // ── AMBIENT SOUND on first click ──
    let audioStarted = false;
    document.addEventListener('click', () => {
        if (audioStarted) return;
        audioStarted = true;
        const ac  = new AudioContext();
        const osc = ac.createOscillator();
        const lfo = ac.createOscillator();
        const lfog = ac.createGain();
        const gain = ac.createGain();
        const filter = ac.createBiquadFilter();

        lfo.frequency.value   = 0.15;
        lfo.type              = 'sine';
        lfog.gain.value       = 4;
        lfo.connect(lfog);
        lfog.connect(osc.frequency);

        osc.type              = 'sine';
        osc.frequency.value   = 58;
        filter.type           = 'lowpass';
        filter.frequency.value= 180;
        gain.gain.setValueAtTime(0, ac.currentTime);
        gain.gain.linearRampToValueAtTime(0.12, ac.currentTime + 3);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);
        osc.start();
        lfo.start();
    }, { once: true });

    // ── THEATER BUTTON ripple ──
    document.getElementById('theaterBtn').addEventListener('click', function(e) {
        e.preventDefault();
        const btn = this;
        btn.style.transition = 'transform 0.15s ease';
        btn.style.transform  = 'scale(0.96)';
        setTimeout(() => {
            btn.style.transform = 'scale(1)';
            setTimeout(() => {
                window.location.href = this.getAttribute('href');
            }, 200);
        }, 150);
    });
    </script>

</body>
</html>
