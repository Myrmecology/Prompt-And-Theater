<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Prompt &amp; Theater — The Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blood:        #8b0000;
            --blood-bright: #c0392b;
            --ash:          #1a1a1a;
            --stone:        #2c2c2c;
            --bone:         #9e9e8a;
            --ember:        #b5451b;
            --gold-dim:     #7a6a3a;
            --panel-bg:     rgba(12, 4, 4, 0.88);
            --border-dim:   rgba(139,0,0,0.3);
            --border-bright:rgba(192,57,43,0.7);
        }

        html, body {
            width: 100%; min-height: 100%;
            background: #000;
            font-family: 'Cinzel', serif;
            color: var(--bone);
            cursor: crosshair;
            overflow-x: hidden;
        }

        /* ── CANVAS BACKGROUND ── */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ── GRAIN ── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 128px 128px;
            opacity: 0.35;
            mix-blend-mode: overlay;
        }

        /* ── VIGNETTE ── */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 40%,
                rgba(0,0,0,0.55) 75%,
                rgba(0,0,0,0.92) 100%
            );
        }

        /* ── LAYOUT ── */
        .page {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 80px;
        }

        /* ── HEADER ── */
        .page-header {
            text-align: center;
            margin-bottom: 12px;
            opacity: 0;
            animation: fade-rise 1s ease forwards;
            animation-delay: 0.2s;
        }

        .back-link {
            display: inline-block;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: var(--gold-dim);
            text-decoration: none;
            text-transform: uppercase;
            margin-bottom: 18px;
            transition: color 0.3s ease;
        }
        .back-link:hover { color: var(--bone); }
        .back-link::before { content: '← '; }

        .page-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.4rem, 4vw, 2.8rem);
            letter-spacing: 0.2em;
            color: var(--bone);
            text-shadow:
                0 0 30px rgba(139,0,0,0.5),
                2px 2px 0 #000;
        }

        .page-title span {
            color: var(--blood-bright);
        }

        .rule {
            width: min(500px, 80vw);
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                var(--gold-dim),
                var(--blood-bright),
                var(--gold-dim),
                transparent
            );
            margin: 14px auto 0;
        }

        /* ── CREATE TICKET PANEL ── */
        .create-panel {
            width: 100%;
            max-width: 780px;
            background: var(--panel-bg);
            border: 1px solid var(--border-dim);
            padding: 32px 36px;
            margin-top: 40px;
            position: relative;
            opacity: 0;
            animation: fade-rise 1s ease forwards;
            animation-delay: 0.5s;
        }

        .create-panel::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(
                135deg,
                rgba(139,0,0,0.15),
                transparent 50%,
                rgba(139,0,0,0.08)
            );
            pointer-events: none;
        }

        /* Corner ornaments */
        .panel-corner {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: var(--blood);
            border-style: solid;
        }
        .panel-corner.tl { top: -1px; left: -1px;  border-width: 2px 0 0 2px; }
        .panel-corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .panel-corner.bl { bottom: -1px; left: -1px;  border-width: 0 0 2px 2px; }
        .panel-corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        .panel-heading {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.85rem;
            letter-spacing: 0.35em;
            color: var(--blood-bright);
            text-transform: uppercase;
            margin-bottom: 22px;
            text-shadow: 0 0 20px rgba(192,57,43,0.4);
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            display: block;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: var(--gold-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .field-input {
            width: 100%;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-dim);
            color: var(--bone);
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            padding: 12px 16px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            resize: none;
            cursor: crosshair;
        }

        .field-input::placeholder {
            color: rgba(158,158,138,0.3);
            font-style: italic;
        }

        .field-input:focus {
            border-color: var(--blood-bright);
            box-shadow:
                inset 0 0 20px rgba(139,0,0,0.1),
                0 0 20px rgba(139,0,0,0.15);
        }

        textarea.field-input {
            min-height: 130px;
            line-height: 1.7;
        }

        .create-btn {
            display: inline-block;
            padding: 14px 48px;
            background: transparent;
            border: 1px solid var(--blood);
            color: var(--bone);
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.8rem;
            letter-spacing: 0.35em;
            cursor: pointer;
            transition: all 0.35s ease;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .create-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--blood);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.35s ease;
            z-index: 0;
        }

        .create-btn:hover::before { transform: scaleX(1); }

        .create-btn span {
            position: relative;
            z-index: 1;
        }

        .create-btn:hover {
            color: #fff;
            box-shadow: 0 0 30px rgba(139,0,0,0.4);
        }

        /* ── TICKETS LIST ── */
        .tickets-section {
            width: 100%;
            max-width: 780px;
            margin-top: 48px;
            opacity: 0;
            animation: fade-rise 1s ease forwards;
            animation-delay: 0.8s;
        }

        .section-heading {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            color: var(--blood-bright);
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .section-heading::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--border-dim), transparent);
        }

        .ticket-count {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--gold-dim);
            margin-bottom: 24px;
            margin-top: 6px;
        }

        .tickets-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── TICKET CARD ── */
        .ticket-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-dim);
            padding: 22px 26px;
            position: relative;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            animation: fade-rise 0.6s ease forwards;
            opacity: 0;
        }

        .ticket-card:hover {
            border-color: var(--border-bright);
            box-shadow: 0 0 30px rgba(139,0,0,0.12);
        }

        .ticket-card-corner {
            position: absolute;
            width: 7px;
            height: 7px;
            border-color: var(--blood);
            border-style: solid;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
        .ticket-card:hover .ticket-card-corner { opacity: 1; }
        .ticket-card-corner.tl { top: 0; left: 0;   border-width: 1px 0 0 1px; }
        .ticket-card-corner.tr { top: 0; right: 0;  border-width: 1px 1px 0 0; }
        .ticket-card-corner.bl { bottom: 0; left: 0;  border-width: 0 0 1px 1px; }
        .ticket-card-corner.br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

        .ticket-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .ticket-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
            color: var(--bone);
            text-shadow: 0 0 12px rgba(139,0,0,0.3);
        }

        .ticket-date {
            font-size: 0.55rem;
            letter-spacing: 0.25em;
            color: var(--gold-dim);
            opacity: 0.7;
            white-space: nowrap;
        }

        .ticket-prompt {
            font-size: 0.78rem;
            line-height: 1.75;
            color: rgba(158,158,138,0.75);
            margin-bottom: 18px;
            font-family: 'Cinzel', serif;
            font-style: italic;
            border-left: 2px solid rgba(139,0,0,0.3);
            padding-left: 14px;
        }

        .ticket-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 7px 20px;
            background: transparent;
            border: 1px solid;
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn.watch {
            border-color: var(--blood);
            color: var(--bone);
        }
        .action-btn.watch:hover {
            background: var(--blood);
            color: #fff;
            box-shadow: 0 0 20px rgba(139,0,0,0.4);
        }

        .action-btn.edit {
            border-color: var(--gold-dim);
            color: var(--gold-dim);
        }
        .action-btn.edit:hover {
            background: var(--gold-dim);
            color: #000;
        }

        .action-btn.delete {
            border-color: rgba(80,80,80,0.5);
            color: rgba(120,120,100,0.6);
        }
        .action-btn.delete:hover {
            border-color: #555;
            color: #888;
            background: rgba(40,40,40,0.5);
        }

        .play-count {
            font-size: 0.55rem;
            letter-spacing: 0.25em;
            color: rgba(139,0,0,0.5);
            margin-left: auto;
            align-self: center;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            border: 1px solid var(--border-dim);
            background: var(--panel-bg);
        }

        .empty-icon {
            font-size: 2rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            color: var(--bone);
            opacity: 0.5;
            margin-bottom: 8px;
        }

        .empty-sub {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: var(--gold-dim);
            opacity: 0.5;
        }

        /* ── EDIT MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #0a0202;
            border: 1px solid var(--blood);
            padding: 36px;
            width: 100%;
            max-width: 620px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 0 60px rgba(139,0,0,0.3);
        }

        .modal-overlay.open .modal {
            transform: translateY(0);
        }

        .modal-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            color: var(--blood-bright);
            margin-bottom: 24px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--bone);
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.1em;
        }
        .modal-close:hover { opacity: 1; }

        /* ── TOAST NOTIFICATION ── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(10,2,2,0.95);
            border: 1px solid var(--blood);
            color: var(--bone);
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            padding: 12px 28px;
            z-index: 200;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── ANIMATIONS ── */
        @keyframes fade-rise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="vignette"></div>

<div class="page">

    <!-- Header -->
    <header class="page-header">
        <div><a href="/" class="back-link">Return To The Gate</a></div>
        <h1 class="page-title">The <span>Tickets</span></h1>
        <div class="rule"></div>
    </header>

    <!-- Create Panel -->
    <section class="create-panel" id="createPanel">
        <span class="panel-corner tl"></span>
        <span class="panel-corner tr"></span>
        <span class="panel-corner bl"></span>
        <span class="panel-corner br"></span>

        <div class="panel-heading">Forge A New Ticket</div>

        <div class="field-group">
            <label class="field-label" for="ticketTitle">Scene Title</label>
            <input
                type="text"
                id="ticketTitle"
                class="field-input"
                placeholder="Name your scene..."
                maxlength="80"
            />
        </div>

        <div class="field-group">
            <label class="field-label" for="ticketPrompt">Scene Prompt</label>
            <textarea
                id="ticketPrompt"
                class="field-input"
                placeholder="Describe what happens... Two figures approach each other, one raises their fist, they begin to fight..."
                maxlength="2000"
            ></textarea>
        </div>

        <button class="create-btn" onclick="createTicket()">
            <span>Create Ticket</span>
        </button>
    </section>

    <!-- Tickets List -->
    <section class="tickets-section">
        <div class="section-heading">Saved Tickets</div>
        <div class="ticket-count" id="ticketCount">Loading...</div>
        <div class="tickets-list" id="ticketsList"></div>
    </section>

</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <div class="modal-title">Edit Ticket</div>
        <button class="modal-close" onclick="closeEditModal()">✕ Close</button>

        <input type="hidden" id="editTicketId"/>

        <div class="field-group">
            <label class="field-label" for="editTitle">Scene Title</label>
            <input type="text" id="editTitle" class="field-input" maxlength="80"/>
        </div>
        <div class="field-group">
            <label class="field-label" for="editPrompt">Scene Prompt</label>
            <textarea id="editPrompt" class="field-input" maxlength="2000"></textarea>
        </div>
        <button class="create-btn" onclick="saveEdit()">
            <span>Save Changes</span>
        </button>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// BACKGROUND
// ============================================================
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const embers = Array.from({length: 35}, () => ({
    x: Math.random() * 1200,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.5 + 0.3,
    vx: (Math.random() - 0.5) * 0.25,
    vy: -(Math.random() * 0.4 + 0.15),
    flicker: Math.random() * Math.PI * 2,
    flickerSpeed: 0.025 + Math.random() * 0.03,
}));

function drawBg() {
    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#000000');
    bg.addColorStop(1, '#080101');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W/2, H, 0, W/2, H, W * 0.6);
    glow.addColorStop(0,   'rgba(80,0,0,0.25)');
    glow.addColorStop(1,   'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    embers.forEach(e => {
        e.x += e.vx; e.y += e.vy;
        e.flicker += e.flickerSpeed;
        if (e.y < -10) { e.y = H + 10; e.x = Math.random() * W; }
        const f = 0.4 + Math.sin(e.flicker) * 0.4;
        const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 2);
        g.addColorStop(0, `rgba(255,70,15,${f * 0.85})`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * 2, 0, Math.PI * 2);
        ctx.fill();
    });

    requestAnimationFrame(drawBg);
}
drawBg();

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}

// ============================================================
// LOAD TICKETS
// ============================================================
async function loadTickets() {
    try {
        const res  = await fetch('/api/tickets/all');
        const data = await res.json();
        renderTickets(data.tickets || []);
    } catch(err) {
        document.getElementById('ticketCount').textContent = 'Failed to load tickets.';
    }
}

function renderTickets(tickets) {
    const list  = document.getElementById('ticketsList');
    const count = document.getElementById('ticketCount');

    if (!tickets.length) {
        count.textContent = 'No tickets exist yet.';
        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🎭</div>
                <div class="empty-title">The Theater Awaits</div>
                <div class="empty-sub">Forge your first ticket above</div>
            </div>`;
        return;
    }

    count.textContent = `${tickets.length} ticket${tickets.length !== 1 ? 's' : ''} in the archive`;
    list.innerHTML = '';

    tickets.forEach((ticket, i) => {
        const card = document.createElement('div');
        card.className = 'ticket-card';
        card.style.animationDelay = `${0.85 + i * 0.08}s`;

        const date = new Date(ticket.updated_at).toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric'
        });

        card.innerHTML = `
            <span class="ticket-card-corner tl"></span>
            <span class="ticket-card-corner tr"></span>
            <span class="ticket-card-corner bl"></span>
            <span class="ticket-card-corner br"></span>
            <div class="ticket-meta">
                <div class="ticket-title">${escapeHtml(ticket.title)}</div>
                <div class="ticket-date">${date}</div>
            </div>
            <div class="ticket-prompt">${escapeHtml(ticket.prompt)}</div>
            <div class="ticket-actions">
                <button class="action-btn watch"
                    onclick="watchTicket('${ticket.id}')">Watch</button>
                <button class="action-btn edit"
                    onclick="openEditModal('${ticket.id}', \`${escapeForAttr(ticket.title)}\`, \`${escapeForAttr(ticket.prompt)}\`)">Edit</button>
                <button class="action-btn delete"
                    onclick="deleteTicket('${ticket.id}', this)">Delete</button>
                <span class="play-count">${ticket.play_count || 0} plays</span>
            </div>`;

        list.appendChild(card);
    });
}

// ============================================================
// CREATE TICKET
// ============================================================
async function createTicket() {
    const title  = document.getElementById('ticketTitle').value.trim();
    const prompt = document.getElementById('ticketPrompt').value.trim();

    if (!prompt) { showToast('A prompt is required.'); return; }

    try {
        const res  = await fetch('/api/tickets/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title: title || 'Untitled Scene', prompt })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('ticketTitle').value  = '';
            document.getElementById('ticketPrompt').value = '';
            showToast('Ticket forged.');
            loadTickets();
        } else {
            showToast(data.error || 'Failed to create ticket.');
        }
    } catch(err) {
        showToast('Something went wrong.');
    }
}

// ============================================================
// WATCH TICKET
// ============================================================
function watchTicket(id) {
    window.location.href = `/api/theater/watch/${id}`;
}

// ============================================================
// EDIT MODAL
// ============================================================
function openEditModal(id, title, prompt) {
    document.getElementById('editTicketId').value = id;
    document.getElementById('editTitle').value    = title;
    document.getElementById('editPrompt').value   = prompt;
    document.getElementById('editModal').classList.add('open');
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
}

async function saveEdit() {
    const id     = document.getElementById('editTicketId').value;
    const title  = document.getElementById('editTitle').value.trim();
    const prompt = document.getElementById('editPrompt').value.trim();

    if (!prompt) { showToast('Prompt cannot be empty.'); return; }

    try {
        const res  = await fetch(`/api/tickets/edit/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title, prompt })
        });
        const data = await res.json();
        if (data.success) {
            closeEditModal();
            showToast('Ticket updated.');
            loadTickets();
        } else {
            showToast(data.error || 'Failed to update ticket.');
        }
    } catch(err) {
        showToast('Something went wrong.');
    }
}

// ============================================================
// DELETE TICKET
// ============================================================
async function deleteTicket(id, btn) {
    if (!confirm('Destroy this ticket? This cannot be undone.')) return;

    try {
        const res  = await fetch(`/api/tickets/delete/${id}`, {
            method: 'DELETE'
        });
        const data = await res.json();
        if (data.success) {
            showToast('Ticket destroyed.');
            loadTickets();
        } else {
            showToast(data.error || 'Failed to delete.');
        }
    } catch(err) {
        showToast('Something went wrong.');
    }
}

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(str) {
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
}

function escapeForAttr(str) {
    return String(str).replace(/`/g,"'").replace(/\\/g,'\\\\');
}

// Close modal on overlay click
document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeEditModal();
});

// Init
loadTickets();
</script>
